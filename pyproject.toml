[build-system]
requires = ["hatchling>=1.25.0,<1.32"]
build-backend = "hatchling.build"

[project]
name = "deep-learning-azure"
version = "0.0.23"
description = "Generic Azure integration layer for dl-core."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "deep-learning-core>=0.1.5,<0.2",
    "azure-ai-ml==1.31.0",
    "azure-identity==1.25.1",
    "azure-storage-blob==12.19.0",
    "azureml-mlflow==1.60.0.post1",
    "filelock>=3,<4",
]

[project.optional-dependencies]
webdataset = [
    "webdataset>=1,<2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.12",
    "twine>=6.0",
    "webdataset>=1,<2",
]

[project.urls]
Homepage = "https://github.com/Blazkowiz47/dl-azure"
Documentation = "https://github.com/Blazkowiz47/dl-azure/tree/main/readme"
Repository = "https://github.com/Blazkowiz47/dl-azure"
Issues = "https://github.com/Blazkowiz47/dl-azure/issues"

[project.entry-points."dl_core.init_extensions"]
azure = "dl_azure.init_extension:AzureInitExtension"

[tool.uv.sources]
deep-learning-core = { index = "testpypi" }

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/dl_azure"]
