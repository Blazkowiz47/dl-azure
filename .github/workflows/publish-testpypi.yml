name: Publish TestPyPI
# TestPyPI setup required before first use:
# 1. Create the `deep-learning-azure` project on TestPyPI.
# 2. Add a Trusted Publisher for:
#    - owner: Blazkowiz47
#    - repository: dl-azure
#    - workflow: publish-testpypi.yml
#    - environment: dl-azure

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.11

      - name: Run Ruff
        run: uv run --no-sync ruff check src tests

      - name: Run tests
        run: uv run --no-sync python -m pytest

      - name: Build distribution artifacts
        run: |
          rm -rf dist
          uv build --no-sources

      - name: Check distribution metadata
        run: uv run --no-sync twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions-testpypi
          path: dist/

  publish:
    name: Publish To TestPyPI
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      id-token: write

    environment:
      name: dl-azure
      url: https://test.pypi.org/p/deep-learning-azure

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions-testpypi
          path: dist/

      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
